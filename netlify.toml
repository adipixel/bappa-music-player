# Static site, no build step — publish the repo root as-is.
[build]
  publish = "."
  command = ""

# config.js holds live values and must never be cached hard, or a fixed
# playlist ID would not reach people already holding a stale copy.
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
